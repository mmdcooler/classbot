# ClassBot — n8n + PostgreSQL  (سرور آلمان)
# قبل از اجرا: فایل .env را از روی .env.example بسازید و مقادیر را پر کنید.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB: ${N8N_DB}
      TZ: Asia/Tehran
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro      # اولین اجرا: جدول‌ها و توابع خودکار ساخته می‌شوند
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    # پورت بیرونی ندارد؛ فقط n8n از شبکه داخلی داکر به آن وصل می‌شود

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"                      # فقط از طریق Nginx/HTTPS در دسترس باشد
    environment:
      # --- آدرس عمومی (برای وبهوک تلگرام الزامی است)
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Asia/Tehran
      TZ: Asia/Tehran
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # --- دیتابیس خود n8n (همان Postgres، دیتابیس جدا)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- مخصوص ClassBot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"        # تا نودها بتوانند $env.TELEGRAM_BOT_TOKEN را بخوانند
      NODE_FUNCTION_ALLOW_BUILTIN: zlib            # برای خواندن فایل‌های Word (docx) در Code node
      # --- جلوگیری از پر شدن دیسک با لاگ اجراها
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168                 # ساعت (۷ روز)
    volumes:
      - ./n8n-data:/home/node/.n8n
